# ==============================================================================
# Production Nginx Configuration for NEC AlgoViz Pro
# Optimized for 100+ Concurrent Users with Static Asset & Video Caching
# ==============================================================================

upstream algoviz_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Gzip Compression to speed up 100 concurrent requests
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client Request Limits
    client_max_body_size 10M;

    # 1. Direct Static Delivery for React Frontend (Sub-millisecond latency)
    location / {
        root /var/www/NEC-ALGOVIZ/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Cache React Static Assets (/assets/*.js, *.css)
    location /assets/ {
        alias /var/www/NEC-ALGOVIZ/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 3. Direct Static Delivery for Backend Videos & Images (Zero Python Overhead)
    location /image/ {
        alias /var/www/NEC-ALGOVIZ/backend/image/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /var/www/NEC-ALGOVIZ/backend/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /videos/ {
        alias /var/www/NEC-ALGOVIZ/backend/videos/;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        expires 30d;
    }

    # 4. Proxy Dynamic API & Algorithm Requests to Flask / Waitress / Gunicorn
    location /api/ {
        proxy_pass http://algoviz_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy graph generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
